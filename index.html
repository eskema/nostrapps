<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nostrapps</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/launcher.css" />
  </head>
  <body>
    <header>
      <div class="headerbar">
        <h1>nostr<br /><span>n</span>apps</h1>
        <form id="launch-form">
          <div class="input-wrap">
            <input
              id="nsite-input"
              placeholder="naddr / nsite /…"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="suggestions" hidden></div>
          </div>
          <button
            id="theme-toggle"
            type="button"
            class="btn btn-link"
            title="Theme"
            aria-label="Toggle theme"
          ></button>
          <input type="file" id="local-folder" webkitdirectory multiple hidden />
        </form>
      </div>
    </header>
    <div id="spaces-bar"></div>
    <main id="stage">
      <div id="stage-controls">
        <button id="tile-windows" type="button" title="tile windows" aria-label="tile windows">
          ▦
        </button>
        <button id="pack-toggle" type="button" title="grid mode" aria-label="grid mode">⊟</button>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
