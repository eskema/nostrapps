<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>permission prompts</title>
    <link rel="stylesheet" href="/src/launcher.css" />
    <style>
      body {
        display: block;
        padding: var(--space-xl);
        background: color-mix(in srgb, var(--surface) 55%, black);
      }
      .mock-bar {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        margin-bottom: var(--space-xl);
        color: #fff;
      }
      .mock-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--space-xxl) var(--space-xl);
        align-items: start;
      }
      .mock-card {
        display: grid;
        gap: var(--space-s);
        justify-items: start;
      }
      .mock-label {
        color: #fff;
      }
      .mock-label b {
        margin-right: var(--space-s);
      }
      .mock-section {
        display: grid;
        gap: var(--space-s);
        justify-items: start;
        margin-bottom: var(--space-xxl);
      }
      /* Settings' window body, roughly: a surface at a window's width. */
      .mock-settings {
        box-sizing: border-box;
        width: min(100%, 32rem);
        padding: var(--space-l);
        border-radius: var(--radius-xl);
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <div class="mock-bar">
      <span>permissions, fake data</span>
      <span id="controls"></span>
    </div>
    <div class="mock-section">
      <div class="mock-label">settings · permissions</div>
      <div class="mock-settings system-napp-settings">
        <div class="settings-panel" id="settings"></div>
      </div>
    </div>
    <div class="mock-grid" id="grid" hidden></div>
    <script type="module" src="/src/mocks/permissions.ts"></script>
  </body>
</html>
