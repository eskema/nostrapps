<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>napp boot</title>
  </head>
  <body>
    <script>
      function reportError(err) {
        try {
          window.parent.postMessage(
            {
              __nostrapps: "napp-boot-error",
              error: err?.message || String(err)
            },
            "*"
          )
        } catch {
          // parent gone
        }
      }

      window.addEventListener("error", e => reportError(e.error || e.message))
      window.addEventListener("unhandledrejection", e => reportError(e.reason))
      ;(async () => {
        const DB_NAME = `files-${location.origin.split("://")[1]}`

        let reg

        // The files store belongs to the service worker: it is the one writer
        // and reader (sw.js, storeCommand). This page only relays. WebKit files
        // a worker's storage apart from a cross-site iframe's, so a store this
        // page wrote was one the worker never saw. Each command answers on its
        // own port.
        function swCall(data, transfer = []) {
          return new Promise((resolve, reject) => {
            const sw =
              navigator.serviceWorker.controller || reg?.active || reg?.waiting || reg?.installing
            if (!sw) return reject(new Error("no service worker"))
            const ch = new MessageChannel()
            ch.port1.onmessage = e => {
              if (e.data?.error) reject(new Error(e.data.error))
              else resolve(e.data)
            }
            sw.postMessage(data, [ch.port2, ...transfer])
          })
        }

        const buffers = files => files.map(f => f.body).filter(b => b instanceof ArrayBuffer)

        // Every step runs, and whatever didn't go is reported: the launcher
        // says a napp was wiped only when all of it went. The files store goes
        // through the worker, before the worker itself does.
        async function wipeAll() {
          const failed = []
          const step = async (what, fn) => {
            try {
              await fn()
            } catch (err) {
              failed.push(`${what}: ${err?.message || err}`)
            }
          }
          if (navigator.serviceWorker.controller || reg?.active) {
            await step("files", () => swCall({ __nostrapps: "sw-store-wipe" }))
          }
          await step("databases", async () => {
            const names = indexedDB.databases
              ? (await indexedDB.databases()).map(d => d.name).filter(Boolean)
              : [DB_NAME]
            await Promise.all(names.map(deleteDatabase))
          })
          await step("local storage", () => localStorage.clear())
          await step("session storage", () => sessionStorage.clear())
          if (typeof caches !== "undefined") {
            await step("caches", async () => {
              const keys = await caches.keys()
              await Promise.all(keys.map(k => caches.delete(k)))
            })
          }
          if (navigator.serviceWorker?.getRegistrations) {
            await step("service worker", async () => {
              const regs = await navigator.serviceWorker.getRegistrations()
              await Promise.all(regs.map(r => r.unregister()))
            })
          }
          if (failed.length) throw new Error(failed.join("; "))
        }

        // A database still open somewhere is only deleted once it closes. Give
        // it a moment, then call it a failure rather than assume it went.
        function deleteDatabase(name) {
          return new Promise((resolve, reject) => {
            const req = indexedDB.deleteDatabase(name)
            let timer
            req.onsuccess = () => {
              clearTimeout(timer)
              resolve()
            }
            req.onerror = () => {
              clearTimeout(timer)
              reject(req.error || new Error(`${name} not deleted`))
            }
            req.onblocked = () => {
              timer = setTimeout(() => reject(new Error(`${name} is still open`)), 3000)
            }
          })
        }

        // Tear down any service worker the NAPP registered for itself, keeping
        // only the launcher's own (served at /sw.js): one of its own would take
        // over serving the napp's files, and with them what gets injected.
        async function unregisterForeignSWs() {
          if (!navigator.serviceWorker?.getRegistrations) return
          try {
            const regs = await navigator.serviceWorker.getRegistrations()
            await Promise.all(
              regs.map(async r => {
                const script = (r.active || r.waiting || r.installing)?.scriptURL || ""
                if (!script.endsWith("/sw.js")) {
                  try {
                    await r.unregister()
                  } catch {}
                }
              })
            )
          } catch {}
        }

        try {
          reg = await navigator.serviceWorker.register("/sw.js")
          await navigator.serviceWorker.ready
          // `ready` resolves with the currently-ACTIVE worker — which is the
          // old sw.js when this origin was last booted before the launcher
          // changed it. The napp window that opens right after boot would then
          // be served by the old worker (missing its newest serving behavior,
          // e.g. the ui-wrapper injection) until a manual reload. update()
          // completes the version check; if a newer worker came out of it,
          // wait for it to activate (it skipWaiting()s) before reporting
          // ready, with a timeout so boot never hangs.
          try {
            await reg.update()
            const fresh = reg.installing || reg.waiting
            if (fresh && fresh.state !== "activated") {
              await new Promise(resolve => {
                const timer = setTimeout(resolve, 3000)
                fresh.addEventListener("statechange", () => {
                  if (fresh.state === "activated" || fresh.state === "redundant") {
                    clearTimeout(timer)
                    resolve()
                  }
                })
              })
            }
          } catch {
            // update check unreachable (e.g. offline) — boot with what we have
          }
          // `ready` means the worker is active, but not necessarily *controlling*
          // this origin yet. The visible napp iframe is created right after boot
          // finishes; if the SW isn't controlling by then, its request to
          // <origin>/ falls through to the dev server, which serves the launcher
          // for any *.localhost host — so the window shows the whole launcher.
          // Wait for control (the SW calls clients.claim() on activate) before
          // reporting ready, with a timeout so boot never hangs.
          if (!navigator.serviceWorker.controller) {
            await new Promise(resolve => {
              navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true })
              setTimeout(resolve, 3000)
            })
          }
        } catch (err) {
          reportError(err)
          return
        }

        // Commands come from the launcher only. This frame's host is
        // <label>.<launcher host>, so the launcher is that minus the label; any
        // other sender (a napp, this one's own windows included) is ignored —
        // it could otherwise wipe a napp, swap its files or rewrite its policy.
        const LAUNCHER = `${location.protocol}//${location.host.slice(location.host.indexOf(".") + 1)}`

        window.addEventListener("message", async event => {
          const data = event.data
          if (!data || event.origin !== LAUNCHER) return
          if (data.__nostrapps === "napp-install") {
            try {
              await unregisterForeignSWs()
              const result = await swCall(
                { __nostrapps: "sw-store-install", files: data.files, policy: data.policy },
                buffers(data.files)
              )
              event.source.postMessage(
                {
                  __nostrapps: "napp-install-done",
                  fileCount: result.fileCount
                },
                event.origin
              )
            } catch (err) {
              event.source.postMessage(
                { __nostrapps: "napp-install-error", error: err.message },
                event.origin
              )
            }
          } else if (data.__nostrapps === "napp-dev-install") {
            try {
              event.source.postMessage({ __nostrapps: "napp-dev-install-done" }, event.origin)

              // Keep this iframe alive as relay between SW and host
              // Listen for file requests from SW
              navigator.serviceWorker.addEventListener("message", swEvent => {
                if (swEvent.data?.__nostrapps === "sw-read-file") {
                  window.parent.postMessage(
                    {
                      __nostrapps: "napp-dev-read-file",
                      nappId: data.nappId,
                      path: swEvent.data.path,
                      requestId: swEvent.data.requestId
                    },
                    "*"
                  )
                }
              })
              // Listen for file responses from host and forward to SW
              window.addEventListener("message", hostEvent => {
                if (hostEvent.origin !== LAUNCHER) return
                if (hostEvent.data?.__nostrapps === "napp-dev-file-result") {
                  if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                      __nostrapps: "sw-file-result",
                      requestId: hostEvent.data.requestId,
                      body: hostEvent.data.body,
                      mime: hostEvent.data.mime,
                      error: hostEvent.data.error
                    })
                  }
                }
              })
            } catch (err) {
              event.source.postMessage(
                { __nostrapps: "napp-dev-install-error", error: err.message },
                event.origin
              )
            }
          } else if (data.__nostrapps === "napp-set-policy") {
            // Update just the policy record (a grant edit after install), then
            // the launcher reloads the napp so its SW re-reads the new CSP. Also
            // tear down any SW the napp registered for itself, so revoking
            // `network` actually cuts it off (its SW ignores the document CSP).
            try {
              await swCall({ __nostrapps: "sw-store-set-policy", policy: data.policy })
              await unregisterForeignSWs()
              event.source.postMessage({ __nostrapps: "napp-set-policy-done" }, event.origin)
            } catch (err) {
              event.source.postMessage(
                { __nostrapps: "napp-set-policy-error", error: err.message },
                event.origin
              )
            }
          } else if (data.__nostrapps === "napp-wipe") {
            try {
              await wipeAll()
              event.source.postMessage({ __nostrapps: "napp-wipe-done" }, event.origin)
            } catch (err) {
              event.source.postMessage(
                { __nostrapps: "napp-wipe-error", error: err.message },
                event.origin
              )
            }
          } else if (data.__nostrapps === "napp-read-files") {
            try {
              const { files } = await swCall({ __nostrapps: "sw-store-read-files" })
              event.source.postMessage(
                { __nostrapps: "napp-read-files-done", files },
                event.origin,
                buffers(files)
              )
            } catch (err) {
              event.source.postMessage(
                { __nostrapps: "napp-read-files-error", error: err.message },
                event.origin
              )
            }
          }
        })

        window.parent.postMessage({ __nostrapps: "napp-boot-ready" }, "*")
      })()
    </script>
  </body>
</html>
